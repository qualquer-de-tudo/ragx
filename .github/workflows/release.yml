name: Release

# Dispara com a tag:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# Ou manualmente, pela aba Actions, informando a versão.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex.: 1.0.0)'
        required: true
        type: string
      draft:
        description: 'Publicar como rascunho'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. os testes correm ANTES de qualquer artefato ────────────────────
  # Publicar primeiro e testar depois é como uma versão quebrada chega ao
  # usuário. Se este job falhar, nada é construído e nada é publicado.
  verificar:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run pytest -q

  # ── 2. pacote Python ──────────────────────────────────────────────────
  # O wheel é `py3-none-any`: um único arquivo serve Windows, Linux e macOS.
  # Construir um por sistema seria desperdício e daria três hashes para a
  # mesma coisa.
  pacote:
    name: Pacote Python
    needs: verificar
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.versao.outputs.valor }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6

      - name: Ler a versão do pyproject
        id: versao
        shell: bash
        run: |
          set -euo pipefail
          # `grep` em vez de Python: o interpretador não é garantido no runner,
          # e derrubar a publicação por causa disso seria constrangedor.
          v=$(grep -m1 '^version = ' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$v" ]; then
            echo "::error::não consegui ler a versão do pyproject.toml"
            exit 1
          fi
          echo "valor=$v" >> "$GITHUB_OUTPUT"
          echo "RAGX $v"

      - name: Conferir que a tag bate com o pyproject
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          arquivo="${{ steps.versao.outputs.valor }}"
          if [ "$tag" != "$arquivo" ]; then
            echo "::error::a tag é v$tag mas o pyproject diz $arquivo"
            echo "Publicar com os dois em desacordo produz um release que"
            echo "instala uma versão diferente da que o nome promete."
            exit 1
          fi

      - run: uv build

      - uses: actions/upload-artifact@v5
        with:
          name: pacote-python
          path: dist/*
          retention-days: 7

  # ── 3. extensão do VS Code ────────────────────────────────────────────
  extensao:
    name: Extensão do VS Code
    needs: verificar
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.versao.outputs.valor }}
    defaults:
      run:
        working-directory: vscode-plugin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-plugin/package-lock.json

      - name: Ler a versão do package.json
        id: versao
        run: |
          v=$(node -p "require('./package.json').version")
          echo "valor=$v" >> "$GITHUB_OUTPUT"
          echo "plugin $v"

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx vsce package --no-dependencies --allow-missing-repository

      - uses: actions/upload-artifact@v5
        with:
          name: extensao-vscode
          path: vscode-plugin/*.vsix
          retention-days: 7

  # ── 4. o instalador funciona? ─────────────────────────────────────────
  # Instalar a partir do WHEEL recém-construído, nos dois sistemas. É o teste
  # que pega o que testar código não pega: PATH, versão de interpretador,
  # extras faltando.
  instalar:
    name: Instalar em ${{ matrix.os }}
    needs: pacote
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6

      - uses: actions/download-artifact@v5
        with:
          name: pacote-python
          path: dist

      - name: Instalar do wheel
        shell: bash
        run: |
          set -euo pipefail
          whl=$(ls dist/*.whl | head -1)
          echo "instalando $whl"
          uv tool install --force --python 3.12 "${whl}[all]"

          # O diretório vem do `uv`, não de um palpite. Escrever
          # "$HOME/.local/bin" aqui foi o que derrubou este job no Windows: em
          # bash, `$HOME` vira /c/Users/... e o PATH do Windows não entende
          # esse formato. O `uv` devolve o caminho nativo de cada sistema.
          bin="$(uv tool dir --bin)"
          echo "bin: $bin"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Verificar
        shell: bash
        run: |
          set -euo pipefail
          ragx --version
          # O MCP já falhou com ModuleNotFoundError depois de uma instalação
          # "bem-sucedida". Este passo é o que impede isso de voltar.
          ragx mcp tools --json > /dev/null
          echo "MCP ok"

      - name: Ciclo completo
        shell: bash
        run: |
          set -euo pipefail
          demo="${RUNNER_TEMP}/demo"
          mkdir -p "$demo/src" && cd "$demo"
          printf 'class AuthService:\n    """Autenticacao via SSO."""\n    def login(self, c):\n        return c\n' > src/auth.py
          echo "AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY" > .env
          ragx init
          ragx index .
          ragx search "autenticacao" --limit 2 --json > /dev/null

          # Contamos `chunk_id` em vez de usar Python: `python` não é garantido
          # no runner, e foi exatamente isso que derrubou este job antes.
          n=$(ragx search "wJalrXUtnFEMI" --mode keyword --json | grep -c '"chunk_id"' || true)
          echo "resultados para o segredo: $n (esperado 0)"
          if [ "$n" != "0" ]; then
            echo "::error::um segredo entrou no índice — o Security Gate falhou"
            exit 1
          fi

  # ── 4b. painel desktop (Windows) ──────────────────────────────────────
  # O .exe do painel instala sozinho a CLI (uv + Python 3.12 + wheel, via
  # --bootstrap no NSIS). Este job é o teste ponta a ponta disso: instala em
  # silêncio, confere que `ragx` responde, desinstala pedindo a remoção da CLI
  # e confere que ela sumiu. Spec: docs/superpowers/specs/2026-09-23-instalador-completo-design.md
  painel-windows:
    name: Painel (Windows)
    needs: verificar
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/app/package-lock.json
      # `prepare-bundle.mjs` chama `uv build --wheel` e o painel embute o uv.
      - uses: astral-sh/setup-uv@v6

      - name: Empacotar o painel
        working-directory: src/app
        run: |
          npm ci --no-audit --no-fund
          npm run package

      - name: Localizar o instalador
        id: exe
        run: |
          $exe = Get-ChildItem src/app/release -Filter '*Setup*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'instalador .exe não foi gerado em src/app/release' }
          Write-Host "instalador: $($exe.FullName) ($([math]::Round($exe.Length/1MB)) MB)"
          "caminho=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Instalar em silêncio
        run: |
          # /S dispara o customInstall, que roda `--bootstrap` e só volta quando
          # a CLI foi instalada (ExecWait). O NSIS não devolve erro do bootstrap
          # de propósito; quem confere é o passo seguinte.
          $p = Start-Process -FilePath '${{ steps.exe.outputs.caminho }}' -ArgumentList '/S' -Wait -PassThru
          Write-Host "instalador terminou com código $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "instalador saiu com $($p.ExitCode)" }
          # Margem para o processo do bootstrap terminar de gravar o binário.
          $ragx = Join-Path $env:USERPROFILE '.local\bin\ragx.exe'
          for ($i = 0; $i -lt 60 -and -not (Test-Path $ragx); $i++) { Start-Sleep -Seconds 5 }
          if (-not (Test-Path $ragx)) {
            $log = Join-Path $env:APPDATA 'RAGX Painel\bootstrap.log'
            if (Test-Path $log) { Get-Content $log }
            throw "ragx.exe não apareceu em $ragx"
          }

      - name: Verificar a CLI instalada
        run: |
          # O PATH do usuário foi gravado no registro, mas este processo não o
          # relê: usamos o diretório direto, como o painel faz.
          $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
          ragx --version
          if ($LASTEXITCODE -ne 0) { throw 'ragx --version falhou' }
          ragx mcp serve --help
          if ($LASTEXITCODE -ne 0) { throw 'ragx mcp serve --help falhou (extra [mcp] ausente?)' }

      - name: Desinstalar removendo a CLI
        run: |
          $uninst = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Uninstall*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninst) { throw 'desinstalador do painel não encontrado' }
          Write-Host "desinstalador: $($uninst.FullName)"
          # `_?=` faz o desinstalador NSIS rodar no lugar (senão ele se copia
          # para %TEMP% e devolve o controle antes de terminar).
          $p = Start-Process -FilePath $uninst.FullName -ArgumentList "/S --remove-cli _?=$($uninst.DirectoryName)" -Wait -PassThru
          Write-Host "desinstalador terminou com código $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "desinstalador saiu com $($p.ExitCode)" }
          $ragx = Join-Path $env:USERPROFILE '.local\bin\ragx.exe'
          if (Test-Path $ragx) { throw "ragx.exe continua em $ragx depois da desinstalação" }
          Write-Host 'ragx.exe removido'

      - uses: actions/upload-artifact@v5
        with:
          name: painel-windows
          path: src/app/release/*Setup*.exe
          retention-days: 7

  # ── 5. publicar ───────────────────────────────────────────────────────
  publicar:
    name: Publicar release
    needs: [pacote, extensao, instalar, painel-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: baixados

      - name: Reunir os artefatos
        id: reunir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp baixados/pacote-python/* release/
          cp baixados/extensao-vscode/*.vsix release/
          cp baixados/painel-windows/*.exe release/
          # Cópia binária: o `.ps1` precisa continuar ASCII e SEM BOM, e o
          # `.sh` precisa de LF. Qualquer reescrita de texto aqui desfaria os
          # dois em silêncio — e um BOM no `.ps1` quebra o `irm | iex`.
          cp install/install.sh install/install.ps1 release/

          cd release
          sha256sum * > SHA256SUMS.txt
          ls -la
          echo "vsix=$(ls *.vsix | head -1)" >> "$GITHUB_OUTPUT"
          echo "whl=$(ls *.whl | head -1)" >> "$GITHUB_OUTPUT"

      - name: Montar as notas
        shell: bash
        run: |
          set -euo pipefail
          RAGX="${{ needs.pacote.outputs.versao }}"
          PLUGIN="${{ needs.extensao.outputs.versao }}"
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          VSIX="${{ steps.reunir.outputs.vsix }}"
          WHL="${{ steps.reunir.outputs.whl }}"

          # Heredoc SEM expansão ('NOTAS' entre aspas): o corpo tem crases e
          # cifrões de blocos de código, e deixá-lo expandir transformaria
          # `$RAGX` dentro de um exemplo em texto vazio. As substituições
          # acontecem depois, uma a uma, com `sed`.
          cat > NOTAS.md <<'NOTAS'
          RAGX **__RAGX__** · extensão do VS Code **__PLUGIN__**

          Knowledge Engine local para projetos de software: indexa o
          repositório, **protege segredos por construção**, responde busca
          híbrida, monta contexto dentro de um orçamento de tokens e serve
          agentes via MCP. Sem servidor, sem nuvem, sem chave de API.

          ## Instalar

          **Um comando.**

          ```bash
          curl -fsSL https://raw.githubusercontent.com/__REPO__/main/install/install.sh | bash
          ```

          ```powershell
          irm https://raw.githubusercontent.com/__REPO__/main/install/install.ps1 | iex
          ```

          Isso instala a partir do `main`. Para pregar **esta** versão — e
          levar junto a extensão do VS Code, que não vem pelo comando único —
          baixe os arquivos desta página e rode o instalador na pasta deles:

          ```bash
          gh release download __TAG__ --repo __REPO__ --dir ragx
          cd ragx && bash install.sh        # Windows: .\install.ps1
          ```

          O instalador põe o `uv` no lugar se não houver, instala o RAGX
          isolado, grava o PATH, registra o servidor MCP no Claude Desktop e no
          Claude Code, e instala a extensão se achar o `code`. Depois,
          **abra um terminal novo** — o PATH só vale na próxima sessão.

          ```bash
          ragx --version
          ```

          ## Usar

          ```bash
          cd seu-projeto
          ragx init
          ragx security scan .    # veja o que será bloqueado ANTES de indexar
          ragx index .
          ragx search "como funciona a autenticação"
          ```

          A partir daí:

          ```bash
          ragx context "implementar SSO" --tokens 3000   # contexto no orçamento
          ragx graph rebuild                             # entidades e relações
          ragx dictionary generate                       # mapa barato do projeto
          ragx watch                                     # o índice segue suas edições
          ragx doctor                                    # o que está fora do lugar
          ```

          **Para o seu agente**, o RAGX é um servidor MCP:

          ```bash
          ragx mcp serve
          ```

          O instalador já o registra no Claude Desktop e no Claude Code. A
          ordem que rende: `get_dictionary` (orientação barata) →
          `search_hybrid` (localizar) → `build_context` (montar o contexto) →
          `get_chunk` (aprofundar).

          **No VS Code**, a extensão abre o índice numa barra lateral ou em
          tela cheia: busca, documentos, grafo de entidades, dicionário,
          origens e tarefas. À mão:

          ```bash
          code --install-extension __VSIX__
          ```

          Depois de atualizar, **recarregue a janela**
          (`Developer: Reload Window`): a extensão mantém um servidor MCP vivo
          e só fala com o RAGX novo na próxima conexão.

          ## Segredo não entra no índice

          Não é filtro na saída, é portão na entrada: o Security Gate examina o
          arquivo **antes** de indexar. O que ele bloqueia não existe no banco,
          então não há consulta, ferramenta MCP nem agente que o alcance.

          Este build **quebra** se um `.env` com credencial entrar no índice do
          projeto de teste. Veja com seus próprios olhos antes de confiar:

          ```bash
          ragx security scan .
          ```

          ## Novidades desta versão

          - **Extensão do VS Code** — busca, documentos, grafo, dicionário,
            origens e tarefas, em barra lateral ou tela cheia.
          - **`list_documents`** — inventário do índice por MCP: o que existe e
            de que origem vem, sem trazer conteúdo.
          - **Erro de argumento agora é `invalid_argument`**, com campo, limite
            e valor recebido na mensagem. Antes virava `internal` e mandava
            caçar num traceback.
          - **Instaladores para Linux, macOS e Windows**, com registro do MCP,
            PATH e verificação no fim — e que **dizem em que linha pararam** se
            algo der errado.
          - **Conhecimento compartilhado entre projetos** (`@base/...`), com a
            origem sempre explícita no resultado.

          Detalhe de tudo no
          [CHANGELOG](https://github.com/__REPO__/blob/__TAG__/CHANGELOG.md).

          ## Verificado nesta build

          - testes em Ubuntu e Windows
          - instalação a partir do wheel nos dois sistemas
          - ciclo completo num projeto novo: `init`, `index`, `search`, MCP
          - um `.env` com credencial no projeto de teste **não** entra no
            índice — o build quebra se entrar

          ## Ressalvas honestas

          - **É uma beta.** A interface de linha de comando e o formato do
            índice ainda podem mudar sem cerimônia entre betas.
          - **A busca híbrida ainda não supera a busca por palavra-chave** neste
            corpus (recall@5 0,65 contra 0,77). O critério documentado não foi
            atingido; o diagnóstico está em `docs/05-busca.md`.

          ## Conferir o download

          ```bash
          sha256sum -c SHA256SUMS.txt
          ```
          NOTAS

          sed -i "s|__RAGX__|$RAGX|g;  s|__PLUGIN__|$PLUGIN|g; s|__REPO__|$REPO|g; \
                  s|__TAG__|$TAG|g;    s|__VSIX__|$VSIX|g;     s|__WHL__|$WHL|g" NOTAS.md
          cat NOTAS.md

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          name: RAGX ${{ needs.pacote.outputs.versao }}
          tag_name: ${{ github.ref_name || format('v{0}', inputs.version) }}
          body_path: NOTAS.md
          files: release/*
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ contains(needs.extensao.outputs.versao, 'beta') }}
          fail_on_unmatched_files: true
