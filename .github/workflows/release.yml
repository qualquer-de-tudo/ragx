name: Release

# Dispara com a tag:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# Ou manualmente, pela aba Actions, informando a versão.
#
# A release publica DOIS arquivos: o instalador do painel (.exe) e o guia de
# uso (GUIA-DE-USO.md). O wheel, o sdist e a extensão do VS Code continuam
# sendo construídos e testados, mas ficam como artefatos do workflow (aba da
# execução), não na página da release. O GitHub acrescenta sozinho o "Source
# code (zip/tar.gz)" a toda release: isso não dá para desligar.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex.: 1.0.0)'
        required: true
        type: string
      draft:
        description: 'Publicar como rascunho'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. os testes correm ANTES de qualquer artefato ────────────────────
  # Publicar primeiro e testar depois é como uma versão quebrada chega ao
  # usuário. Se este job falhar, nada é construído e nada é publicado.
  verificar:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run pytest -q

  # ── 2. pacote Python ──────────────────────────────────────────────────
  # O wheel é `py3-none-any`: um único arquivo serve Windows, Linux e macOS.
  # Construir um por sistema seria desperdício e daria três hashes para a
  # mesma coisa.
  pacote:
    name: Pacote Python
    needs: verificar
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.versao.outputs.valor }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6

      - name: Ler a versão do pyproject
        id: versao
        shell: bash
        run: |
          set -euo pipefail
          # `grep` em vez de Python: o interpretador não é garantido no runner,
          # e derrubar a publicação por causa disso seria constrangedor.
          v=$(grep -m1 '^version = ' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$v" ]; then
            echo "::error::não consegui ler a versão do pyproject.toml"
            exit 1
          fi
          echo "valor=$v" >> "$GITHUB_OUTPUT"
          echo "RAGX $v"

      - name: Conferir que a versão pedida bate com os arquivos
        shell: bash
        env:
          PEDIDA: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
        run: |
          set -euo pipefail
          pedida="${PEDIDA#v}"
          # O painel e a extensão têm versão própria no package.json. O painel
          # ficou em 0.0.0 enquanto o produto estava na beta 3, e o instalador
          # sairia como RAGX-Painel-Setup-0.0.0.exe. `scripts/versao.py` sobe
          # os três juntos; aqui só se confere.
          painel=$(grep -m1 '"version"' src/app/package.json | sed 's/.*"\([^"]*\)",*$/\1/')
          plugin=$(grep -m1 '"version"' vscode-plugin/package.json | sed 's/.*"\([^"]*\)",*$/\1/')
          erro=0
          for par in "pyproject.toml=${{ steps.versao.outputs.valor }}" "src/app/package.json=$painel" "vscode-plugin/package.json=$plugin"; do
            if [ "${par#*=}" != "$pedida" ]; then
              echo "::error::a release pede $pedida mas ${par%%=*} diz ${par#*=}"
              erro=1
            fi
          done
          if [ "$erro" != 0 ]; then
            echo "Publicar com versões em desacordo produz uma release que instala"
            echo "uma versão diferente da que o nome promete. Rode:"
            echo "  uv run python scripts/versao.py $pedida"
            exit 1
          fi
          echo "versão $pedida confere nos três arquivos"

      - run: uv build

      - uses: actions/upload-artifact@v5
        with:
          name: pacote-python
          path: dist/*
          retention-days: 30

  # ── 3. extensão do VS Code ────────────────────────────────────────────
  extensao:
    name: Extensão do VS Code
    needs: verificar
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.versao.outputs.valor }}
    defaults:
      run:
        working-directory: vscode-plugin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-plugin/package-lock.json

      - name: Ler a versão do package.json
        id: versao
        run: |
          v=$(node -p "require('./package.json').version")
          echo "valor=$v" >> "$GITHUB_OUTPUT"
          echo "plugin $v"

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx vsce package --no-dependencies --allow-missing-repository

      - uses: actions/upload-artifact@v5
        with:
          name: extensao-vscode
          path: vscode-plugin/*.vsix
          retention-days: 30

  # ── 4. o instalador funciona? ─────────────────────────────────────────
  # Instalar a partir do WHEEL recém-construído, nos dois sistemas. É o teste
  # que pega o que testar código não pega: PATH, versão de interpretador,
  # extras faltando.
  instalar:
    name: Instalar em ${{ matrix.os }}
    needs: pacote
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6

      - uses: actions/download-artifact@v5
        with:
          name: pacote-python
          path: dist

      - name: Instalar do wheel
        shell: bash
        run: |
          set -euo pipefail
          whl=$(ls dist/*.whl | head -1)
          echo "instalando $whl"
          uv tool install --force --python 3.12 "${whl}[all]"

          # O diretório vem do `uv`, não de um palpite. Escrever
          # "$HOME/.local/bin" aqui foi o que derrubou este job no Windows: em
          # bash, `$HOME` vira /c/Users/... e o PATH do Windows não entende
          # esse formato. O `uv` devolve o caminho nativo de cada sistema.
          bin="$(uv tool dir --bin)"
          echo "bin: $bin"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Verificar
        shell: bash
        run: |
          set -euo pipefail
          ragx --version
          # O MCP já falhou com ModuleNotFoundError depois de uma instalação
          # "bem-sucedida". Este passo é o que impede isso de voltar.
          ragx mcp tools --json > /dev/null
          echo "MCP ok"

      - name: Ciclo completo
        shell: bash
        run: |
          set -euo pipefail
          demo="${RUNNER_TEMP}/demo"
          mkdir -p "$demo/src" && cd "$demo"
          printf 'class AuthService:\n    """Autenticacao via SSO."""\n    def login(self, c):\n        return c\n' > src/auth.py
          echo "AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY" > .env
          ragx init
          ragx index .
          ragx search "autenticacao" --limit 2 --json > /dev/null

          # Contamos `chunk_id` em vez de usar Python: `python` não é garantido
          # no runner, e foi exatamente isso que derrubou este job antes.
          n=$(ragx search "wJalrXUtnFEMI" --mode keyword --json | grep -c '"chunk_id"' || true)
          echo "resultados para o segredo: $n (esperado 0)"
          if [ "$n" != "0" ]; then
            echo "::error::um segredo entrou no índice — o Security Gate falhou"
            exit 1
          fi

  # ── 4b. painel desktop (Windows) ──────────────────────────────────────
  # O .exe do painel instala sozinho a CLI (uv + Python 3.12 + wheel, via
  # --bootstrap no NSIS). Este job é o teste ponta a ponta disso: instala em
  # silêncio, confere que `ragx` responde, desinstala pedindo a remoção da CLI
  # e confere que ela sumiu. Spec: docs/superpowers/specs/2026-09-23-instalador-completo-design.md
  painel-windows:
    name: Painel (Windows)
    needs: verificar
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/app/package-lock.json
      # `prepare-bundle.mjs` chama `uv build --wheel` e o painel embute o uv.
      - uses: astral-sh/setup-uv@v6

      - name: Empacotar o painel
        working-directory: src/app
        run: |
          npm ci --no-audit --no-fund
          npm run package

      - name: Localizar o instalador
        id: exe
        run: |
          $exe = Get-ChildItem src/app/release -Filter '*Setup*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'instalador .exe não foi gerado em src/app/release' }
          Write-Host "instalador: $($exe.FullName) ($([math]::Round($exe.Length/1MB)) MB)"
          "caminho=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Instalar em silêncio
        run: |
          # O setup-uv (necessário só para empacotar) define UV_TOOL_DIR e
          # UV_TOOL_BIN_DIR, e o uv do instalador herdava isso: o ragx.exe ia
          # para D:\a\_temp\uv-tool-bin-dir e este passo o procurava em
          # ~\.local\bin. Sem elas, a instalação é a de uma máquina de verdade.
          Remove-Item Env:UV_TOOL_DIR, Env:UV_TOOL_BIN_DIR, Env:UV_CACHE_DIR -ErrorAction SilentlyContinue
          # /S dispara o customInstall, que roda `--bootstrap` e só volta quando
          # a CLI foi instalada (ExecWait). O NSIS não devolve erro do bootstrap
          # de propósito; quem confere é o passo seguinte.
          #
          # Neste runner o stub do NSIS às vezes morre com 0xC0000005 (acesso
          # inválido) nos primeiros 2-3 s, antes de extrair qualquer arquivo: 2
          # de 5 instalações na mesma imagem, com o mesmo .exe, que nas outras
          # instala tudo em ~16 s. Só esse código ganha nova tentativa; qualquer
          # outro reprova na hora. O módulo que crashou vai para o log (evento
          # 1000 do Windows Error Reporting) para a causa poder ser tratada.
          for ($tentativa = 1; $tentativa -le 3; $tentativa++) {
            $inicio = Get-Date
            $p = Start-Process -FilePath '${{ steps.exe.outputs.caminho }}' -ArgumentList '/S' -Wait -PassThru
            Write-Host "instalador terminou com código $($p.ExitCode) (tentativa $tentativa)"
            if ($p.ExitCode -ne -1073741819) { break }
            $crash = Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000; StartTime=$inicio} -ErrorAction SilentlyContinue |
              Select-Object -First 1
            Write-Host "::warning::instalador do painel crashou (0xC0000005) na tentativa $tentativa. $($crash.Message -replace '\s+', ' ')"
          }
          if ($p.ExitCode -ne 0) { throw "instalador saiu com $($p.ExitCode)" }
          # Margem para o processo do bootstrap terminar de gravar o binário.
          $ragx = Join-Path $env:USERPROFILE '.local\bin\ragx.exe'
          for ($i = 0; $i -lt 60 -and -not (Test-Path $ragx); $i++) { Start-Sleep -Seconds 5 }
          if (-not (Test-Path $ragx)) {
            $log = Join-Path $env:APPDATA 'app\bootstrap.log'
            if (Test-Path $log) { Get-Content $log }
            throw "ragx.exe não apareceu em $ragx"
          }

      - name: Verificar a CLI instalada
        run: |
          Remove-Item Env:UV_TOOL_DIR, Env:UV_TOOL_BIN_DIR, Env:UV_CACHE_DIR -ErrorAction SilentlyContinue
          # O PATH do usuário foi gravado no registro, mas este processo não o
          # relê: usamos o diretório direto, como o painel faz.
          $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
          ragx --version
          if ($LASTEXITCODE -ne 0) { throw 'ragx --version falhou' }
          ragx mcp serve --help
          if ($LASTEXITCODE -ne 0) { throw 'ragx mcp serve --help falhou (extra [mcp] ausente?)' }

      - name: Desinstalar removendo a CLI
        run: |
          Remove-Item Env:UV_TOOL_DIR, Env:UV_TOOL_BIN_DIR, Env:UV_CACHE_DIR -ErrorAction SilentlyContinue
          $uninst = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Uninstall*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $uninst) { throw 'desinstalador do painel não encontrado' }
          Write-Host "desinstalador: $($uninst.FullName)"
          # `_?=` faz o desinstalador NSIS rodar no lugar (senão ele se copia
          # para %TEMP% e devolve o controle antes de terminar).
          $p = Start-Process -FilePath $uninst.FullName -ArgumentList "/S --remove-cli _?=$($uninst.DirectoryName)" -Wait -PassThru
          Write-Host "desinstalador terminou com código $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "desinstalador saiu com $($p.ExitCode)" }
          $ragx = Join-Path $env:USERPROFILE '.local\bin\ragx.exe'
          if (Test-Path $ragx) { throw "ragx.exe continua em $ragx depois da desinstalação" }
          Write-Host 'ragx.exe removido'

      - uses: actions/upload-artifact@v5
        with:
          name: painel-windows
          path: src/app/release/*Setup*.exe
          retention-days: 7

  # ── 5. publicar ───────────────────────────────────────────────────────
  publicar:
    name: Publicar release
    needs: [pacote, extensao, instalar, painel-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: baixados

      - name: Reunir os artefatos
        id: reunir
        shell: bash
        run: |
          set -euo pipefail
          # Só o que o usuário final precisa: o instalador e o guia. O wheel e a
          # extensão ficam nos artefatos do workflow (retenção maior abaixo).
          mkdir -p release
          cp baixados/painel-windows/*.exe release/
          cp docs/GUIA-DE-USO.md release/
          cd release
          ls -la
          exe="$(ls *Setup*.exe | head -1)"
          echo "exe=$exe" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$exe" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Montar as notas
        shell: bash
        run: |
          set -euo pipefail
          RAGX="${{ needs.pacote.outputs.versao }}"
          EXE="${{ steps.reunir.outputs.exe }}"
          SHA="${{ steps.reunir.outputs.sha }}"
          REPO="${{ github.repository }}"
          # No disparo manual, `github.ref_name` é o nome do ramo (`main`).
          TAG="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}"

          # A seção desta versão no CHANGELOG vira "Novidades". Texto fixo aqui
          # envelhecia: as notas da beta 3 ainda anunciavam o que era da beta 1.
          awk -v alvo="## [$RAGX]" 'index($0, alvo)==1 {f=1; next} f && /^## \[/ {exit} f {print}' \
            CHANGELOG.md > novidades.md
          if ! grep -q '[^[:space:]]' novidades.md; then
            echo "Sem seção [$RAGX] no CHANGELOG; veja o arquivo completo." > novidades.md
          fi

          # Heredoc SEM expansão ('NOTAS' entre aspas): o corpo tem crases e
          # cifrões de blocos de código. As substituições acontecem depois, uma
          # a uma, com `sed`.
          cat > NOTAS.md <<'NOTAS'
          RAGX **__RAGX__**: Knowledge Engine local para projetos de software.
          Indexa o repositório, **protege segredos por construção**, monta
          contexto dentro de um orçamento de tokens e serve agentes via MCP.
          Sem servidor, sem nuvem, sem chave de API.

          ## Instalar

          1. Baixe **`__EXE__`** em *Assets*, logo abaixo, e execute.
          2. O instalador põe o painel **e** a CLI (uv, Python 3.12 e o `ragx`),
             sem precisar de nada instalado antes.
          3. Leia o **`GUIA-DE-USO.md`** (também em *Assets*) para os primeiros
             passos.

          O executável ainda não é assinado, então o Windows SmartScreen mostra
          "O Windows protegeu o computador". Clique em **Mais informações →
          Executar assim mesmo**. Para conferir o arquivo:

          ```powershell
          Get-FileHash .\__EXE__ -Algorithm SHA256
          ```

          ```text
          __SHA__
          ```

          Para atualizar, rode o instalador da versão nova por cima.

          ## Novidades desta versão

          __NOVIDADES__

          Detalhe de tudo no
          [CHANGELOG](https://github.com/__REPO__/blob/__TAG__/CHANGELOG.md).

          ## Verificado nesta build

          - testes em Ubuntu, macOS e Windows
          - o instalador do painel, em silêncio, deixa o `ragx` respondendo, e
            o desinstalador o remove
          - ciclo completo num projeto novo: `init`, `index`, `search`, MCP
          - um `.env` com credencial no projeto de teste **não** entra no
            índice — o build quebra se entrar

          ## Ressalvas honestas

          - **É uma beta.** A interface de linha de comando e o formato do
            índice ainda podem mudar sem cerimônia entre betas.
          - **A busca híbrida ainda não supera a busca por palavra-chave** neste
            corpus (recall@5 0,65 contra 0,77). O diagnóstico está em
            `docs/05-busca.md`.
          - Os arquivos "Source code" no fim da lista são gerados pelo GitHub em
            toda release; o que você precisa é o `.exe`.
          NOTAS

          sed -i "s|__RAGX__|$RAGX|g; s|__REPO__|$REPO|g; s|__TAG__|$TAG|g; \
                  s|__EXE__|$EXE|g; s|__SHA__|$SHA|g" NOTAS.md
          # O CHANGELOG entra por último e por arquivo: tem `|`, `&` e barras
          # que um `sed` interpretaria.
          awk 'FNR==NR {n = n $0 "\n"; next} $0 == "__NOVIDADES__" {printf "%s", n; next} {print}' \
            novidades.md NOTAS.md > NOTAS.tmp && mv NOTAS.tmp NOTAS.md
          cat NOTAS.md

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          name: RAGX ${{ needs.pacote.outputs.versao }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
          body_path: NOTAS.md
          files: release/*
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ contains(needs.extensao.outputs.versao, 'beta') }}
          fail_on_unmatched_files: true
