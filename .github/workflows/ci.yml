name: CI

# Roda em cada push e PR. É o portão que impede uma tag de release sair de um
# commit quebrado.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ragx:
    name: RAGX (${{ matrix.os }} · py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Os três sistemas que o projeto promete suportar (o install.sh já se
        # descreve como "para Linux e macOS" desde sempre — só nunca tinha
        # rodado de verdade), e a versão mínima junto com uma atual. IDs de
        # chunk precisam bater entre plataformas — rodar só em Linux esconderia
        # exatamente esse tipo de bug.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Instalar dependências
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Testes
        run: uv run pytest -q

      - name: Suíte de segurança (isolada)
        # Roda de novo sozinha: se um teste de segurança começar a depender de
        # ordem ou de estado deixado por outro, isto quebra e nós ficamos
        # sabendo antes de publicar.
        run: uv run pytest tests/security -q

  plugin:
    name: Extensão do VS Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-plugin

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-plugin/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Empacotar (prova que o .vsix sai)
        run: npx vsce package --no-dependencies --allow-missing-repository

  instalador:
    name: Instalador (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Preparar diretorios de clientes MCP (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$HOME/.cursor" "$HOME/.codeium/windsurf" "$HOME/.gemini" "$HOME/.codex"
          # Conteúdo PRÉ-EXISTENTE de verdade, não pasta vazia: os bugs reais
          # (duplicação de tabela TOML, BOM, escape) só apareceram ANEXANDO a
          # um arquivo que já tinha algo — nunca no caminho de arquivo novo,
          # que é o único que uma pasta vazia exercita.
          printf 'model = "gpt-5"\n' > "$HOME/.codex/config.toml"
          printf '{"unrelated_key": "value"}\n' > "$HOME/.gemini/settings.json"

      # O valor deste job é provar a instalação de ponta a ponta: os três bugs
      # corrigidos na 0.3.1 só apareceram rodando o instalador de verdade.
      - name: Instalar (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash install/install.sh

      - name: Preparar diretorios de clientes MCP (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.cursor" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.codeium\windsurf" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.gemini" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.codex" | Out-Null
          # Conteúdo PRÉ-EXISTENTE de verdade, não pasta vazia: os bugs reais
          # (duplicação de tabela TOML, BOM, escape) só apareceram ANEXANDO a
          # um arquivo que já tinha algo — nunca no caminho de arquivo novo,
          # que é o único que uma pasta vazia exercita.
          Set-Content -Path "$env:USERPROFILE\.codex\config.toml" -Value 'model = "gpt-5"' -Encoding utf8NoBOM
          Set-Content -Path "$env:USERPROFILE\.gemini\settings.json" -Value '{"unrelated_key": "value"}' -Encoding utf8NoBOM

      # Sem `-SemMcp`: o passo de verificação logo abaixo depende do MCP estar
      # registrado de verdade nos quatro clientes, não só da instalação em si.
      - name: Instalar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\install\install.ps1

      - name: Verificar registro multi-cliente (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # `Get-Content` detecta e descarta um BOM sozinho, o que faria este
          # script aprovar um arquivo que o `JSON.parse` do Node (quem os
          # clientes de verdade usam) rejeitaria. Checa os bytes crus primeiro
          # para o bug de BOM não escapar da verificação.
          function Assert-SemBom($caminho, $rotulo) {
              $bytes = [System.IO.File]::ReadAllBytes($caminho)
              if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
                  throw "$rotulo`: arquivo gravado COM BOM - quebra o JSON.parse do Node"
              }
          }

          function Verificar-Json($caminho, $rotulo) {
              Assert-SemBom $caminho $rotulo
              $dados = Get-Content -Raw -Path $caminho | ConvertFrom-Json
              if (-not $dados.mcpServers.ragx) { throw "$rotulo`: ragx ausente em mcpServers" }
              return $dados
          }

          Verificar-Json "$env:USERPROFILE\.cursor\mcp.json" 'Cursor' | Out-Null
          Verificar-Json "$env:USERPROFILE\.codeium\windsurf\mcp_config.json" 'Windsurf' | Out-Null
          $gemini = Verificar-Json "$env:USERPROFILE\.gemini\settings.json" 'Gemini CLI'
          if ($gemini.unrelated_key -ne 'value') { throw "Gemini CLI: conteudo pre-existente foi perdido" }

          $codexPath = "$env:USERPROFILE\.codex\config.toml"
          Assert-SemBom $codexPath 'Codex CLI'
          $codexTexto = Get-Content -Raw -Path $codexPath
          if ($codexTexto -notmatch 'model\s*=\s*"gpt-5"') { throw "Codex CLI: conteudo pre-existente foi perdido" }

          # PowerShell não tem parser de TOML na stdlib: reusa o `tomllib` do
          # Python, que o runner windows-latest já traz (3.12+), para validar
          # de verdade em vez de só bater substring — o que teria deixado
          # passar cada um dos bugs de escape/BOM já corrigidos neste branch.
          $env:RAGX_VERIFICAR_TOML = $codexPath
          python -c "import os, tomllib; p = os.environ['RAGX_VERIFICAR_TOML']; d = tomllib.loads(open(p, encoding='utf-8').read()); assert 'ragx' in d.get('mcp_servers', {}), 'ragx ausente em mcp_servers'"
          if ($LASTEXITCODE -ne 0) { throw "Codex CLI: config.toml invalido ou sem ragx em mcp_servers" }

          Write-Host "MCP registrado em Cursor, Windsurf, Gemini CLI e Codex CLI"

      - name: Colocar o ragx no PATH deste job
        shell: bash
        run: |
          set -euo pipefail
          # O diretório vem do `uv`, não de um palpite: `setup-uv` e o
          # instalador do uv podem apontar para lugares diferentes, e no
          # Windows o `uv` devolve o caminho NATIVO (C:\...), que é o único
          # formato que o GITHUB_PATH entende.
          bin="$(uv tool dir --bin)"
          echo "bin: $bin"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Verificar que o comando existe e funciona
        shell: bash
        run: |
          set -euo pipefail
          ragx --version
          # O MCP falhava com ModuleNotFoundError depois de uma instalação
          # "bem-sucedida". Este passo é o que impede isso de voltar.
          ragx mcp tools --json > /dev/null
          echo "MCP ok"

      - name: Verificar registro multi-cliente (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "
          import json, pathlib, tomllib, os
          h = os.environ['HOME']
          for p in ('/.cursor/mcp.json', '/.codeium/windsurf/mcp_config.json'):
              dados = json.loads(pathlib.Path(h + p).read_text(encoding='utf-8'))
              assert 'ragx' in dados.get('mcpServers', {}), f'ragx ausente em {p}'
          gemini = json.loads(pathlib.Path(h + '/.gemini/settings.json').read_text(encoding='utf-8'))
          assert 'ragx' in gemini.get('mcpServers', {}), 'ragx ausente em .gemini/settings.json'
          assert gemini.get('unrelated_key') == 'value', 'conteudo pre-existente do Gemini CLI foi perdido'
          codex_texto = pathlib.Path(h + '/.codex/config.toml').read_text(encoding='utf-8')
          assert 'model = \"gpt-5\"' in codex_texto, 'conteudo pre-existente do Codex CLI foi perdido'
          codex = tomllib.loads(codex_texto)
          assert 'ragx' in codex.get('mcp_servers', {}), 'ragx ausente em mcp_servers'
          print('todos os arquivos MCP sao JSON/TOML validos e contem ragx')
          "
          echo "MCP registrado em Cursor, Windsurf, Gemini CLI e Codex CLI"

      - name: Ciclo completo num projeto novo
        shell: bash
        run: |
          set -euo pipefail
          demo="${RUNNER_TEMP}/demo"
          mkdir -p "$demo/src" && cd "$demo"
          printf 'class AuthService:\n    """Autenticacao via SSO."""\n    def login(self, c):\n        return c\n' > src/auth.py
          echo "AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY" > .env
          ragx init
          ragx index .
          ragx search "autenticacao" --limit 2 --json > /dev/null

          # O segredo NÃO pode estar no índice. Contamos `chunk_id` em vez de
          # usar Python: `python` não é garantido no runner, e foi exatamente
          # isso que derrubou este job antes.
          n=$(ragx search "wJalrXUtnFEMI" --mode keyword --json | grep -c '"chunk_id"' || true)
          echo "resultados para o segredo: $n (esperado 0)"
          if [ "$n" != "0" ]; then
            echo "::error::um segredo entrou no índice — o Security Gate falhou"
            exit 1
          fi

      # Os bugs reais deste branch (duplicação de tabela TOML, BOM, escape de
      # backslash/aspas) só existem no caminho de rodar o instalador DUAS
      # vezes sobre uma configuração já registrada — a primeira instalação,
      # acima, nunca exercitou isso. Reinstalar e verificar de novo prova que
      # o registro multi-cliente é idempotente.
      - name: Reinstalar para provar idempotencia (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash install/install.sh

      - name: Verificar idempotencia do registro multi-cliente (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "
          import json, pathlib, tomllib, os
          h = os.environ['HOME']
          for p in ('/.cursor/mcp.json', '/.codeium/windsurf/mcp_config.json'):
              dados = json.loads(pathlib.Path(h + p).read_text(encoding='utf-8'))
              assert 'ragx' in dados.get('mcpServers', {}), f'ragx ausente em {p}'
          gemini = json.loads(pathlib.Path(h + '/.gemini/settings.json').read_text(encoding='utf-8'))
          assert 'ragx' in gemini.get('mcpServers', {}), 'ragx ausente em .gemini/settings.json'
          assert gemini.get('unrelated_key') == 'value', 'conteudo pre-existente do Gemini CLI foi perdido'
          codex_texto = pathlib.Path(h + '/.codex/config.toml').read_text(encoding='utf-8')
          assert 'model = \"gpt-5\"' in codex_texto, 'conteudo pre-existente do Codex CLI foi perdido'
          # Duas tabelas [mcp_servers.ragx] (registro duplicado na segunda
          # rodada) fariam este tomllib.loads falhar — que e o ponto deste
          # teste.
          codex = tomllib.loads(codex_texto)
          assert 'ragx' in codex.get('mcp_servers', {}), 'ragx ausente em mcp_servers'
          print('registro multi-cliente e idempotente')
          "
          echo "segunda instalacao nao duplicou nem corrompeu nada"

      - name: Reinstalar para provar idempotencia (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\install\install.ps1

      - name: Verificar idempotencia do registro multi-cliente (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # `Get-Content` detecta e descarta um BOM sozinho, o que faria este
          # script aprovar um arquivo que o `JSON.parse` do Node (quem os
          # clientes de verdade usam) rejeitaria. Checa os bytes crus primeiro
          # para o bug de BOM não escapar da verificação.
          function Assert-SemBom($caminho, $rotulo) {
              $bytes = [System.IO.File]::ReadAllBytes($caminho)
              if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
                  throw "$rotulo`: arquivo gravado COM BOM - quebra o JSON.parse do Node"
              }
          }

          function Verificar-Json($caminho, $rotulo) {
              Assert-SemBom $caminho $rotulo
              $dados = Get-Content -Raw -Path $caminho | ConvertFrom-Json
              if (-not $dados.mcpServers.ragx) { throw "$rotulo`: ragx ausente em mcpServers" }
              return $dados
          }

          Verificar-Json "$env:USERPROFILE\.cursor\mcp.json" 'Cursor' | Out-Null
          Verificar-Json "$env:USERPROFILE\.codeium\windsurf\mcp_config.json" 'Windsurf' | Out-Null
          $gemini = Verificar-Json "$env:USERPROFILE\.gemini\settings.json" 'Gemini CLI'
          if ($gemini.unrelated_key -ne 'value') { throw "Gemini CLI: conteudo pre-existente foi perdido" }

          $codexPath = "$env:USERPROFILE\.codex\config.toml"
          Assert-SemBom $codexPath 'Codex CLI'
          $codexTexto = Get-Content -Raw -Path $codexPath
          if ($codexTexto -notmatch 'model\s*=\s*"gpt-5"') { throw "Codex CLI: conteudo pre-existente foi perdido" }

          # Duas tabelas [mcp_servers.ragx] (registro duplicado na segunda
          # rodada) fariam este parse com tomllib falhar.
          $env:RAGX_VERIFICAR_TOML = $codexPath
          python -c "import os, tomllib; p = os.environ['RAGX_VERIFICAR_TOML']; d = tomllib.loads(open(p, encoding='utf-8').read()); assert 'ragx' in d.get('mcp_servers', {}), 'ragx ausente em mcp_servers'"
          if ($LASTEXITCODE -ne 0) { throw "Codex CLI: config.toml invalido ou sem ragx em mcp_servers apos reinstalar" }

          Write-Host "segunda instalacao nao duplicou nem corrompeu nada"
