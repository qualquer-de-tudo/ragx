[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragx"
version = "1.0.2"
description = "Knowledge Engine local para projetos de software: indexa, protege segredos, busca, monta contexto e serve agentes via MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pathspec>=0.12",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Conjunto de instalacao recomendado. Servir agentes por MCP e busca semantica
# sao o proposito do RAGX, nao acessorios — e um `ragx mcp serve` que falha com
# ModuleNotFoundError depois de uma instalacao bem-sucedida e o pior tipo de
# surpresa. Os extras individuais continuam existindo para quem quer o minimo.
all = ["fastembed>=0.3", "mcp>=1.2", "tiktoken>=0.7"]
embed = ["fastembed>=0.3"]
parse = ["markdown-it-py>=3.0", "tree-sitter-language-pack>=0.2", "sqlparse>=0.5", "ruamel.yaml>=0.18"]
mcp = ["mcp>=1.2"]
tokens = ["tiktoken>=0.7"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
ragx = "ragx.cli.main:main"
# Alias histórico. A documentação usa `ragx`; `rag` continua funcionando para
# não quebrar script, alias de shell e configuração de MCP já existentes.
rag = "ragx.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ragx"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ragx.core.*", "ragx.security.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: testes rápidos sem I/O",
    "integration: testes com SQLite real",
    "security: BLOQUEANTE — gate, fixture de segredos, superfícies",
    "e2e: fluxo completo pela CLI",
    "slow: excluído do ciclo rápido",
]

[tool.coverage.run]
source = ["src/ragx"]
branch = true
