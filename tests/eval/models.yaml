# Candidatos do `ragx bench models` (RAGX-0169). O benchmark só mede o que JÁ está em disco: um candidato ausente é
# relatado como `ausente` com a linha de `how_to_get`, nunca baixado. Adotar um modelo é decisão de uma pessoa (RAGX-0103).

- name: minilm-atual
  provider: fastembed
  model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  dim: 384
  kind: embedding
  license: apache-2.0
  how_to_get: "já é o modelo do índice (cache do fastembed)"

- name: ollama-nomic-embed-text
  provider: ollama
  model: nomic-embed-text
  dim: 768
  kind: embedding
  license: apache-2.0
  how_to_get: "ollama pull nomic-embed-text"

