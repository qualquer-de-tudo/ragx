appId: com.ragx.painel
productName: RAGX Painel
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
# Bundle da CLI (uv.exe + wheel + bundle.json), gerado por scripts/prepare-bundle.mjs.
# Fica em <instalacao>/resources/ragx-bundle, fora do asar.
extraResources:
  - from: resources/ragx-bundle
    to: ragx-bundle
# sql.js carrega seu binário .wasm via `fs` em tempo de execução
# (ver electron/data/project-stats.ts). Dentro de um asar, `fs` não consegue
# ler binários da forma que o sql.js espera, então o .wasm precisa ficar
# fora do arquivo — asarUnpack extrai para app.asar.unpacked/, e
# `require.resolve` no main process é redirecionado para lá de forma
# transparente pelo Electron.
asarUnpack:
  - node_modules/sql.js/dist/*.wasm
# Ícone e metadados do .exe: gravados por este hook com o rcedit do npm (ver
# signAndEditExecutable abaixo).
afterPack: scripts/after-pack.cjs
win:
  target: nsis
  # Gerado por scripts/brand.py (tile azul com o símbolo). O NSIS usa o mesmo
  # arquivo para o instalador e o desinstalador.
  icon: build/icon.ico
  #
  # signAndEditExecutable: false — este build não assina o executável (sem
  # certificado configurado, e não é objetivo desta versão). Sem essa flag,
  # electron-builder ainda tenta editar recursos do .exe via rcedit, que por
  # sua vez baixa o pacote `winCodeSign` (ferramentas third-party) — e esse
  # download falha em Windows sem "Developer Mode" habilitado, porque o
  # 7z contém symlinks (libs .dylib do macOS) que exigem privilégio de
  # criar link simbólico. Desabilitar edição de recursos evita essa
  # dependência por completo; o ícone e os metadados do .exe ficam a cargo
  # do hook afterPack acima.
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Sem espaços: o nome vai para a release e para o SHA256SUMS.txt.
  artifactName: RAGX-Painel-Setup-${version}.${ext}
  # customInstall/customRemoveFiles: instala e remove a CLI ragx (ver o arquivo).
  include: build/installer.nsh
