# Deny-list por NOME de arquivo — avaliada antes de qualquer leitura de conteúdo.
# Arquivo que casa é bloqueado: zero bytes seguem adiante.
# Ver docs/02-seguranca.md.

version: 1

# Extensões de CÓDIGO-FONTE e documentação.
#
# Uma regra por nome existe para não LER arquivos que são, por definição, um
# recipiente de segredo: `.env`, `id_rsa`, `*.pem`. Um módulo `.py` ou `.ts`
# não é isso — é código, e código com nome sugestivo é o caso comum, não o
# raro: `tokens.py` (contagem de tokens), `tokens.ts` (design tokens),
# `auth_token.go`, `docs/tokens.md`.
#
# Isto NÃO abre exceção para arquivo sensível: só vale para as regras marcadas
# com `content_decides: true` — as que adivinham pelo nome — e o conteúdo
# continua passando pela fase 2 inteira. Segredo de verdade dentro de
# `tokens.py` continua bloqueado; o que deixa de acontecer é bloquear um
# módulo inteiro porque o nome dele lembra "token".
#
# Formatos de DADOS ficam de fora de propósito: `credentials.json`,
# `secrets.yaml` e `tokens.toml` são exatamente onde credencial de verdade
# mora, e continuam bloqueados pelo nome.
code_extensions:
  - .py
  - .pyi
  - .ts
  - .tsx
  - .js
  - .jsx
  - .mjs
  - .cjs
  - .go
  - .rs
  - .java
  - .kt
  - .kts
  - .rb
  - .php
  - .cs
  - .c
  - .h
  - .cc
  - .cpp
  - .hpp
  - .m
  - .mm
  - .swift
  - .scala
  - .ex
  - .exs
  - .dart
  - .lua
  - .pl
  - .r
  - .vue
  - .svelte
  - .css
  - .scss
  - .sass
  - .less
  - .md
  - .mdx
  - .rst
  - .adoc

# Templates sem valor real. Passam a fase 1, mas o conteúdo ainda é verificado
# na fase 2 — template com segredo real vira BLOCK.
allow:
  - "**/.env.example"
  - "**/.env.sample"
  - "**/.env.template"
  - "**/.env.dist"
  - "**/.env.test"
  - "**/*.example"
  - "**/*.sample"
  - "**/*.template"
  - "**/*.dist"
  - "**/credentials.example*"
  - "**/secrets.example*"

deny:
  - id: dotenv
    severity: critical
    patterns: ["**/.env", "**/.env.*", "**/*.env"]
    reason: "arquivo de variáveis de ambiente"

  - id: pem
    severity: critical
    patterns: ["**/*.pem", "**/*.p12", "**/*.pfx", "**/*.jks", "**/*.keystore", "**/*.asc"]
    reason: "material criptográfico"

  - id: private-key
    severity: critical
    patterns: ["**/*.key", "**/*.ppk"]
    reason: "chave privada"

  - id: ssh-private-key
    severity: critical
    patterns:
      - "**/id_rsa"
      - "**/id_dsa"
      - "**/id_ecdsa"
      - "**/id_ed25519"
      - "**/id_rsa.*"
      - "**/id_ed25519.*"
      - "**/.ssh/**"
    reason: "chave SSH"

  - id: credentials
    severity: critical
    content_decides: true
    patterns: ["**/credentials", "**/credentials.*", "**/*credential*"]
    reason: "arquivo de credenciais"

  - id: secrets
    severity: critical
    content_decides: true
    patterns: ["**/secret", "**/secret.*", "**/secrets", "**/secrets.*", "**/*secrets*"]
    reason: "arquivo de segredos"

  - id: tokens
    severity: critical
    # Os dois mecanismos juntos, porque resolvem metades diferentes:
    #
    # - a lista abaixo é precisa e mantém bloqueado o que é DADO
    #   (`tokens.json`, `api_token.txt`, `refresh-tokens.yaml`);
    # - `content_decides` libera o que é CÓDIGO e ainda casa (`auth_token.py`,
    #   `refresh-token.go` batem em `**/*_token.*` e `**/*-token.*`).
    #
    # Sozinha, a lista ainda bloqueia módulo legítimo; sozinho, o
    # `content_decides` precisaria de globs largos demais.
    content_decides: true
    patterns:
      - "**/token"
      - "**/tokens"
      - "**/token.txt"
      - "**/token.json"
      - "**/token.yaml"
      - "**/token.yml"
      - "**/token.toml"
      - "**/tokens.txt"
      - "**/tokens.json"
      - "**/tokens.yaml"
      - "**/tokens.yml"
      - "**/tokens.toml"
      - "**/*_token"
      - "**/*-token"
      - "**/*_tokens"
      - "**/*-tokens"
      - "**/*_token.*"
      - "**/*-token.*"
      - "**/*_tokens.*"
      - "**/*-tokens.*"
    reason: "arquivo de tokens"

  - id: password-file
    severity: critical
    content_decides: true
    patterns: ["**/password*", "**/passwd*", "**/.htpasswd"]
    reason: "arquivo de senha"

  - id: shell-credentials
    severity: critical
    patterns: ["**/.netrc", "**/_netrc", "**/.pgpass", "**/.my.cnf"]
    reason: "credencial de ferramenta de linha de comando"

  - id: cloud-credentials
    severity: critical
    patterns:
      - "**/.aws/**"
      - "**/.gnupg/**"
      - "**/.docker/config.json"
      - "**/service-account*.json"
      - "**/gcp-*.json"
      - "**/aws-credentials*"
      - "**/azure-credentials*"
    reason: "credencial de provedor de nuvem"

  - id: password-manager
    severity: critical
    patterns: ["**/*.kdbx", "**/*.agilekeychain", "**/*.opvault"]
    reason: "base de gerenciador de senhas"

  - id: terraform-state
    severity: high
    patterns: ["**/*.tfstate", "**/*.tfstate.backup", "**/*.tfvars"]
    reason: "state do Terraform carrega segredo em claro"
